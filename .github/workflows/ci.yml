name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography z3-solver
    
    - name: Debug environment and files
      run: |
        echo "=== Workspace contents ==="
        ls -la
        echo "=== Python version and path ==="
        python --version
        python -c "import sys, os; print('Python:', sys.version); print('CWD:', os.getcwd()); print('sys.path:', sys.path)"
    
    - name: Test critical imports (including z3 for predicates)
      run: |
        echo "=== Testing all imports for VERA Packet v0.3 ==="
        python -c "import kerna_ledger_hash; print('SUCCESS: kerna_ledger_hash imported')"
        python -c "import schema_validation; print('SUCCESS: schema_validation imported')"
        python -c "import merkle; print('SUCCESS: merkle imported')"
        python -c "import z3; print('SUCCESS: z3 imported')"
        python -c "from cryptography.hazmat.primitives.asymmetric import ed25519; print('SUCCESS: cryptography ed25519 OK')"
        echo "All imports successful — env is healthy for deterministic compliance."
    
    - name: Run VERA Packet v0.3 production tests
      run: python vera_packet_v0.3.py
    
    - name: Verify output
      run: echo "VERA v0.3 CI passed successfully"
