name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography z3-solver
    - name: Run VERA Packet tests
      run: python vera_packet_v0.3.py
    - name: Verify output
      run: echo "VERA v0.3 CI passed successfully"