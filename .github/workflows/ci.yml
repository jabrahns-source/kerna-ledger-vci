name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography z3-solver pytest

    - name: Test critical imports
      run: |
        python -c "import kerna_ledger_hash, schema_validation, merkle, z3"
        python -c "from cryptography.hazmat.primitives.asymmetric import ed25519; print('ed25519 ok')"

    - name: Run VERA Packet v0.3 production tests
      run: python vera_packet_v0.3.py

    - name: Run unit tests
      run: python -m pytest tests/ -q
