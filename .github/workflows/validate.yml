name: Validate Whitepaper
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq jq
    
    - name: Lint Markdown (basic)
      run: |
        # Skip strict markdownlint if config missing; just check for basic issues
        if [ -f .markdownlint.json ]; then
          echo "markdownlint config present — would run full lint"
        else
          echo "No .markdownlint.json — performing basic markdown presence check"
          for f in *.md; do
            if [ -f "$f" ]; then
              echo "OK: $f exists ($(wc -l < "$f") lines)"
            fi
          done
        fi
    
    - name: Validate JSON
      run: |
        shopt -s nullglob
        files=(*.json)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No *.json files found — skipping"
        else
          for f in "${files[@]}"; do
            echo "Validating $f"
            jq . "$f" > /dev/null || exit 1
            echo "OK: $f"
          done
        fi
    
    - name: Check links (optional / soft)
      continue-on-error: true
      uses: lycheeverse/lychee-action@v1
      with:
        args: --verbose --no-progress README.md *.md
        fail: false
